<h2>Available Courses</h2>

<input
type="text"
[(ngModel)]="searchText"
placeholder="Search Course">

<br><br>

<div *ngFor="let c of courses | courseFilter:searchText">

<app-course-card
[course]="c">
</app-course-card>

</div>

<hr>

<h2>Users from API</h2>

<ul>

<li *ngFor="let user of users">

{{user.name}}

</li>

</ul>
